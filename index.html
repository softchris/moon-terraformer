<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Terraformer</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" hidden>
  <div class="card" id="missionCard"></div>
  <div class="card" id="progressCard"></div>
  <div class="card" id="infoCard" hidden></div>
  <button id="resetBtn" class="ghost small">Reset progress</button>
</div>

<button id="muteBtn" class="ghost" title="Mute (M)">🔊</button>
<div id="caption"></div>

<div id="intro">
  <div class="intro-inner">
    <div class="eyebrow">An n8n adventure</div>
    <h1>MOON<br>TERRAFORMER</h1>
    <p>Wire up workflows to land, build and bring a dead world to life.</p>
    <button id="startBtn" class="primary big" disabled>Loading assets…</button>
    <div class="loadbar"><div id="loadFill"></div></div>
  </div>
</div>

<div id="editor" hidden>
  <header class="ed-top">
    <div class="ed-title"><span id="edTitle"></span></div>
    <div class="ed-actions">
      <button id="clearBtn" class="ghost">Clear workflow</button>
      <button id="runBtn" class="primary">▶ Execute workflow</button>
      <button id="closeBtn" class="ghost" title="Back to orbit">✕</button>
    </div>
  </header>
  <div class="ed-body">
    <aside id="palette"></aside>
    <div id="canvasWrap"></div>
    <aside id="side">
      <div class="tabs" id="tabs"><button data-tab="mission" class="active">Mission</button><button data-tab="node">Node</button></div>
      <div id="tabMission"></div>
      <div id="tabNode" hidden></div>
    </aside>
  </div>
  <div id="toast"></div>
</div>
<datalist id="fieldsDl"></datalist>

<script type="module" src="js/main.js"></script>
</body>
</html>
